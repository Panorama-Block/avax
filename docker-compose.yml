version: '3.8'

services:
  # Our Avax data extractor application
  avax-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081" 
    env_file:
      - .env.docker
    networks:
      - avax_dev_network
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - avax-extractor
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "avax-extractor:8081", "--log=stdout"]
    ports:
      - "4040:4040" 
    env_file:
      - .env.docker
    networks:
      - avax_dev_network

networks:
  avax_dev_network:
    driver: bridge 